plugins { id 'com.android.application' }

android {
    namespace 'com.openai.strandterrain'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.strandterrain'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
