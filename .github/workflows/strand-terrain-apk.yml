name: Build Strand Terrain Recovery APK

on:
  push:
    branches: [chatgpt-strand-terrain-recovery]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install v0.6 asset tools
        run: python3 -m pip install --quiet pillow numpy trimesh pygltflib fast-simplification

      - name: Prepare v0.6 Iceland CC0 assets
        working-directory: strand-prototype
        run: |
          set -euxo pipefail
          python3 tools/prepare_v06_assets.py
          ls -lh app/src/main/res/drawable-nodpi/*.jpg app/src/main/res/raw/*.bin

      - name: Patch stable renderer to v0.5 base
        working-directory: strand-prototype
        run: python3 tools/patch_v05.py

      - name: Apply v0.6 blueprint
        working-directory: strand-prototype
        run: |
          set -euxo pipefail
          python3 tools/patch_v06.py
          grep -nE 'STRAND TERRAIN v0.6|scannedOutcrops|buildGrass|uGrass|distance=19' app/src/main/java/com/openai/strandterrain/SafeActivity.java | head -30

      - name: Build release APK
        working-directory: strand-prototype
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp strand-prototype/app/build/outputs/apk/release/app-release.apk StrandTerrain-v0.6.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs StrandTerrain-v0.6.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging StrandTerrain-v0.6.apk | head -8
          ls -lh StrandTerrain-v0.6.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StrandTerrain-v0.6
          path: StrandTerrain-v0.6.apk
