name: Build Strand Terrain APK

on:
  push:
    branches: [chatgpt-strand-terrain-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: strand-prototype
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp strand-prototype/app/build/outputs/apk/release/app-release.apk StrandTerrain-v0.2.apk
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs StrandTerrain-v0.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging StrandTerrain-v0.2.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: StrandTerrain-v0.2
          path: StrandTerrain-v0.2.apk
