name: Build Strand Terrain Recovery APK

on:
  push:
    branches: [chatgpt-strand-terrain-recovery]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch Iceland CC0 assets
        run: |
          set -euxo pipefail
          OUT="strand-prototype/app/src/main/res/drawable-nodpi"
          mkdir -p "$OUT" /tmp/strand-assets
          UA="StrandTerrainPrototype/0.5 (+https://polyhaven.com)"
          curl -L --fail --retry 3 -A "$UA" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/leafy_grass/leafy_grass_diff_4k.jpg" -o /tmp/strand-assets/leafy_grass.jpg
          curl -L --fail --retry 3 -A "$UA" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/dirt/dirt_diff_1k.jpg" -o "$OUT/dirt_diff_1k.jpg"
          curl -L --fail --retry 3 -A "$UA" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/mossy_rock/mossy_rock_diff_4k.jpg" -o /tmp/strand-assets/mossy_rock.jpg
          python3 -m pip install --quiet pillow
          cd strand-prototype
          python3 tools/prepare_v05_assets.py
          file app/src/main/res/drawable-nodpi/*.jpg
      - name: Patch v0.5 Iceland geology
        working-directory: strand-prototype
        run: |
          set -euxo pipefail
          python3 tools/patch_v05.py
          grep -nE 'STRAND TERRAIN v0.5|MAX_ROCKS|distance=24|formations=|final int seg=12' app/src/main/java/com/openai/strandterrain/SafeActivity.java | head -20
      - name: Build release APK
        working-directory: strand-prototype
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp strand-prototype/app/build/outputs/apk/release/app-release.apk StrandTerrain-v0.5.apk
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs StrandTerrain-v0.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging StrandTerrain-v0.5.apk | head -8
          ls -lh StrandTerrain-v0.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StrandTerrain-v0.5
          path: StrandTerrain-v0.5.apk
