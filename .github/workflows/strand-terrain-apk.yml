name: Build Strand Terrain Recovery APK

on:
  push:
    branches: [chatgpt-strand-terrain-recovery]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Iceland grass-dominant ground texture
        run: |
          set -euxo pipefail
          OUT="strand-prototype/app/src/main/res/drawable-nodpi"
          mkdir -p "$OUT" /tmp/strand-assets
          UA="StrandTerrainPrototype/0.4.3 (+https://polyhaven.com)"
          curl -L --fail --retry 3 -A "$UA" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/leafy_grass/leafy_grass_diff_4k.jpg" -o /tmp/strand-assets/leafy_grass.jpg
          curl -L --fail --retry 3 -A "$UA" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/dirt/dirt_diff_1k.jpg" -o "$OUT/dirt_diff_1k.jpg"
          curl -L --fail --retry 3 -A "$UA" "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rock_ground/rock_ground_diff_1k.jpg" -o "$OUT/rock_ground_diff_1k.jpg"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageEnhance
          im=Image.open('/tmp/strand-assets/leafy_grass.jpg').convert('RGB').resize((1024,1024),Image.Resampling.LANCZOS)
          # Slightly cool/green the scan while retaining natural luminance and texture detail.
          r,g,b=im.split()
          g=ImageEnhance.Brightness(g).enhance(1.08)
          r=ImageEnhance.Brightness(r).enhance(0.96)
          b=ImageEnhance.Brightness(b).enhance(0.98)
          im=Image.merge('RGB',(r,g,b))
          im.save('strand-prototype/app/src/main/res/drawable-nodpi/aerial_grass_rock_diff_1k.jpg','JPEG',quality=88,optimize=True)
          PY
          file "$OUT"/*.jpg
      - name: Build release APK
        working-directory: strand-prototype
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp strand-prototype/app/build/outputs/apk/release/app-release.apk StrandTerrain-v0.4.3.apk
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs StrandTerrain-v0.4.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging StrandTerrain-v0.4.3.apk | head -8
          ls -lh StrandTerrain-v0.4.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StrandTerrain-v0.4.3
          path: StrandTerrain-v0.4.3.apk
